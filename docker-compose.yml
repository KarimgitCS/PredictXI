# Just the api service — the database is hosted (Neon/Supabase), never
# containerized. See PLAN.md's "Dev DB" decision.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: soccer_iq_api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
